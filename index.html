<!doctype html>
<html lang="zh-Hant-HK" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>賽馬實驗室 Racing Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root,[data-theme="dark"]{
  --bg:#0D1311;--panel:#141C19;--raised:#1B2521;--line:#27322D;--line-soft:#1E2824;--text:#E6ECE8;--muted:#9AA7A0;--faint:#76837C;
  --chip:#1E2824;--disc:#E6ECE8;--disc-fg:#0D1311;--btn:#1B2521;--btn-border:#33403A;--primary:#3DBF84;--primary-fg:#04140C;
  --input:#0F1614;--header:#111916;--good:#3DBF84;--value-text:#F0A04B;--gap-text:#F0A04B;--status-bg:#16382A;--status-fg:#9BE3BF;
  --pending-bg:#2A2F2C;--pending-fg:#C9D3CD;--warn-bg:#3A2614;--warn-fg:#F5C08A;--qimen-border:#4A3B22;--track:#0F1614;
  --track-band:#1E6B44;--track-awt:#8A5524;--track-rail:#CFE3D6;--infield:#17221D;--post:#E6ECE8;--start:#F0A04B;
  --lit:#F2C25E;--lit-fg:#2A1C05;--ring-gap:#141C19;--chip-on-bg:#3A2C12;--chip-on-fg:#F7DFA6;--chip-on-border:#C9A04A;--tir:#8DB8F0;
  --glow:0 0 0 2px var(--ring-gap),0 0 0 4px var(--lit),0 0 14px 2px var(--lit);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#F3F4F1;--panel:#FFFFFF;--raised:#F3F4F1;--line:#DCE0DB;--line-soft:#EEF0EC;--text:#15201B;--muted:#5B6660;--faint:#76807A;
  --chip:#F3F4F1;--disc:#15201B;--disc-fg:#FFFFFF;--btn:#FFFFFF;--btn-border:#C9CFC9;--primary:#0E5A3A;--primary-fg:#FFFFFF;
  --input:#FFFFFF;--header:#FFFFFF;--good:#0E5A3A;--value-text:#B54708;--gap-text:#8A3A12;--status-bg:#E3EFE8;--status-fg:#0A3F29;
  --pending-bg:#ECEDEA;--pending-fg:#3A4440;--warn-bg:#FBEBDD;--warn-fg:#8A3A12;--qimen-border:#E2D2AE;--track:#EEF0EC;
  --track-band:#2E8B57;--track-awt:#9C6430;--track-rail:#FFFFFF;--infield:#F2EFD9;--post:#15201B;--start:#B54708;
  --lit:#A8700E;--lit-fg:#FFFFFF;--ring-gap:#FFFFFF;--chip-on-bg:#FBF0D9;--chip-on-fg:#5C3D08;--chip-on-border:#B7862A;--tir:#1F4E8C;
  --glow:0 0 0 2px var(--ring-gap),0 0 0 4px var(--lit);
  color-scheme:light;
}
[data-theme="dark"] .rk-Banker{--row:#3D3410;--bar:#F2D06B;--tag:#F2D06B;--tag-fg:#1A1505;--bead-fg:#1A1505}
[data-theme="dark"] .rk-Core{--row:#1A4D35;--bar:#4FD69A;--tag:#3DBF84;--tag-fg:#04140C;--bead-fg:#04140C}
[data-theme="dark"] .rk-Value{--row:#4D3215;--bar:#F5A94F;--tag:#F0A04B;--tag-fg:#1F1206;--bead-fg:#1F1206}
[data-theme="dark"] .rk-Average,[data-theme="dark"] .rk-Risk{--row:#22303A;--bar:#8FA6B8;--tag:#3A4B58;--tag-fg:#E3ECF3;--bead-fg:#0D1311}
[data-theme="dark"] .rk-Low{--row:#0B0F0E;--bar:#4A5550;--tag:#1A201E;--tag-fg:#8A9690;--bead-fg:#E6ECE8}
[data-theme="light"] .rk-Banker{--row:#FBF1CF;--bar:#B8860B;--tag:#15201B;--tag-fg:#FFFFFF;--bead-fg:#FFFFFF}
[data-theme="light"] .rk-Core{--row:#CFEBDB;--bar:#0E7A4C;--tag:#0E5A3A;--tag-fg:#FFFFFF;--bead-fg:#FFFFFF}
[data-theme="light"] .rk-Value{--row:#FBDDBE;--bar:#D9711C;--tag:#B54708;--tag-fg:#FFFFFF;--bead-fg:#1F1206}
[data-theme="light"] .rk-Average,[data-theme="light"] .rk-Risk{--row:#E6ECF2;--bar:#7B8E9E;--tag:#D3DCE4;--tag-fg:#26323C;--bead-fg:#0D1311}
[data-theme="light"] .rk-Low{--row:#FFFFFF;--bar:#C3C9C4;--tag:#EDEFEB;--tag-fg:#4F5852;--bead-fg:#15201B}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans TC',system-ui,-apple-system,'PingFang HK','Microsoft JhengHei',sans-serif;font-size:15px;line-height:1.5}
button,select,textarea,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--lit);outline-offset:2px}
.num{font-family:'Barlow Condensed','Noto Sans TC',sans-serif;font-variant-numeric:tabular-nums}
.serif{font-family:'Noto Serif TC',serif}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.hidden{display:none !important}
h1,h2{margin:0}
h2{font-size:18px;font-weight:700}

header.top{background:var(--header);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding:14px clamp(16px,3vw,32px);display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 260px}
.brand-name{font-size:18px;font-weight:700;letter-spacing:.04em}
.brand-sub{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
.badge{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;padding:2px 8px;border-radius:4px;background:var(--disc);color:var(--disc-fg)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{height:44px;padding:0 16px;border:1px solid var(--btn-border);border-radius:8px;background:var(--btn);display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.btn-icon{width:44px;padding:0;justify-content:center}
.btn-primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);font-weight:700}
.btn-q[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-fg);border-color:var(--chip-on-border)}
select.sel{height:44px;padding:0 12px;border:1px solid var(--btn-border);border-radius:8px;background:var(--input);font-size:15px;max-width:260px}
.src{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted);border:1px solid var(--line);white-space:nowrap}

.wrap{max-width:1360px;margin:0 auto;padding:20px clamp(16px,3vw,32px) 48px;display:flex;flex-direction:column;gap:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pad{padding:20px 24px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted)}
.chip{padding:4px 10px;border-radius:6px;background:var(--chip)}
.status{font-size:13px;font-weight:500;padding:3px 10px;border-radius:999px}
.status.done{background:var(--status-bg);color:var(--status-fg)}
.status.pending{background:var(--pending-bg);color:var(--pending-fg)}

.admin{display:flex;flex-wrap:wrap;gap:20px;padding:20px}
.admin textarea{width:100%;padding:12px;border:1px solid var(--btn-border);border-radius:8px;background:var(--input);font-family:ui-monospace,Menlo,monospace;font-size:13px;resize:vertical}
.boxr{border-radius:8px;background:var(--raised);padding:16px;display:flex;flex-direction:column;gap:8px}

nav.tabs{overflow-x:auto}
.tabs-in{display:flex;gap:8px;min-width:max-content}
.tab{min-width:92px;height:60px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.tab[aria-current="page"]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.tab b{font-family:'Barlow Condensed',sans-serif;font-size:20px;line-height:1}
.tab span{font-size:12px;opacity:.85}

.card{display:flex;flex-wrap:wrap;gap:24px;align-items:stretch}
.card-info{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{border-radius:10px;background:var(--raised);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;line-height:1.1}
.trackfig{flex:1 1 360px;margin:0;border-radius:12px;background:var(--raised);padding:12px 14px;display:flex;flex-direction:column;justify-content:center}

.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col-main{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:20px}
.col-side{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:20px}

.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.lane{min-width:0;padding:0 12px;display:flex;flex-direction:column;gap:6px}
.lane+.lane{border-left:1px solid var(--line-soft)}
.lane-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.lane:first-child .lane-h{border-bottom-color:var(--primary)}
.lane:first-child .lane-h b{color:var(--good)}
.lane-r{display:flex;align-items:center;gap:8px;min-width:0;padding:3px 0}
.lane-r .nm{flex:1;min-width:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bead{width:30px;height:30px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;background:var(--bar);color:var(--bead-fg)}
.lit-ring{box-shadow:var(--glow)}

.board{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}
.board-core{flex:2 1 380px;min-width:0;display:flex;flex-direction:column;gap:8px}
.board-val{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:8px;padding-left:20px;border-left:1px solid var(--line-soft)}
.pill-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--row)}
.cores{display:flex;flex-wrap:wrap;gap:8px}
.cores .pill-row{flex:1 1 180px;min-width:0}

.rank-wrap{overflow-x:auto}
.rank-in{min-width:860px}
.rgrid{display:grid;grid-template-columns:40px 46px minmax(150px,1.5fr) 80px minmax(150px,2fr) 84px 50px 38px 56px 56px;align-items:center;gap:0 10px;padding:8px 24px}
.rhead{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.rrow{padding:10px 24px;border-bottom:1px solid var(--bg);background:var(--row);box-shadow:inset 5px 0 0 var(--bar)}
.rrow.dim{color:var(--muted)}
.disc{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;background:var(--disc);color:var(--disc-fg)}
.disc.on{background:var(--lit);color:var(--lit-fg);box-shadow:var(--glow)}
.tag{justify-self:start;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:5px;background:var(--tag);color:var(--tag-fg)}
.bar{flex:1;height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--bar)}
.gaprow{display:flex;align-items:center;gap:10px;padding:0 24px;height:20px;background:var(--panel)}
.gaprow i{flex:1;border-top:1px dashed var(--btn-border)}
.place{justify-self:end;min-width:34px;height:30px;padding:0 8px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;border:1px solid var(--btn-border);color:var(--muted)}
.place.top{background:var(--disc);color:var(--disc-fg);border-color:var(--disc)}
.ptag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--lit);color:var(--lit-fg)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:2px;background:var(--row);border:2px solid var(--bar)}

.qframe{background:#2A2018;padding:10px;border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.qpaint{position:relative;aspect-ratio:1280/653;overflow:hidden;border:1px solid #B8995C;border-radius:2px;background:#10131A}
.qpaint img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .6s}
.qpaint .qsvg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.qhit{position:absolute;width:33.334%;height:33.334%;margin:0;padding:0;border:0;background:transparent}
.qhit:hover{background:radial-gradient(ellipse at center,rgba(255,214,140,.16),rgba(255,214,140,0) 70%)}
.qhit:focus-visible{outline:2px solid #F2C25E;outline-offset:-6px;border-radius:6px}
.qlab{position:absolute;display:flex;align-items:flex-start;gap:6px;pointer-events:none}
.qseal{display:flex;flex-direction:column;align-items:center;flex:none;font-family:'Noto Serif TC',serif;font-size:14px;font-weight:700;line-height:1.1;padding:4px;border-radius:3px;background:#9E3A2E;color:#F8EDD6;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:box-shadow .4s,background .4s}
.qseal.on{background:#C8402E;box-shadow:0 0 0 2px #F2C25E,0 0 18px 4px rgba(255,200,100,.75)}
.qseal.mid{background:rgba(20,24,22,.45);border:1px solid rgba(250,245,232,.85);color:#FAF5E8;box-shadow:none;font-size:13px;padding:3px 4px}
.qcap svg{flex:none}
.qcap{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;line-height:1.4;padding:1px 6px;border-radius:3px;white-space:nowrap;background:rgba(250,245,232,.88);color:#3A3328}
.night .qcap{background:rgba(14,20,34,.72);color:#E8E4D8}
.qcap.on{background:rgba(255,228,166,.95) !important;color:#3A2608 !important}
.qnums{position:absolute;display:flex;gap:3px;pointer-events:none}
.qn{min-width:22px;height:22px;padding:0 4px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;background:rgba(250,245,232,.9);color:#3A3328;border:1px solid rgba(58,51,40,.25);transition:background .4s,box-shadow .4s}
.qn.on{background:#F2C25E;color:#2A1C05;border-color:#FFE7A8;box-shadow:0 0 10px 2px rgba(255,205,110,.8)}
.qn.off{color:#A39A88}
.seg{display:flex;border:1px solid var(--btn-border);border-radius:8px;overflow:hidden}
.seg button{height:40px;padding:0 14px;border:0;background:var(--btn);font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-fg)}
.litlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.litlist .pill-row .disc{width:28px;height:28px;font-size:15px}

.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.res-t{border-radius:10px;padding:12px;background:var(--row);display:flex;flex-direction:column;gap:6px}
.divrow{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line-soft)}
.combo{display:flex;gap:4px;flex-wrap:wrap}
.combo span{min-width:24px;height:24px;padding:0 4px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;background:var(--chip);border:1px solid var(--btn-border)}
.empty{font-size:14px;color:var(--muted);padding:6px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));background:var(--disc);color:var(--disc-fg);padding:12px 16px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:50}

@media (max-width:700px){
  .kpis{grid-template-columns:1fr 1fr}
  .lanes{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px}
  .lane:nth-child(3){border-left:0}
  .board-val{padding-left:0;border-left:0}
  .qcap{display:none !important}
  .qn{min-width:16px;height:16px;font-size:11px;padding:0 2px}
  .qseal{font-size:11px;padding:2px 3px}
  .res{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="var(--primary)"/><path d="M10 24V14a7 7 0 0 1 14 0v10" stroke="var(--primary-fg)" stroke-width="2.4" stroke-linecap="round"/><circle cx="10" cy="24" r="1.6" fill="var(--primary-fg)"/><circle cx="24" cy="24" r="1.6" fill="var(--primary-fg)"/></svg>
      <div style="display:flex;flex-direction:column">
        <span class="brand-name">賽馬實驗室</span>
        <span class="brand-sub">RACING LAB</span>
      </div>
      <span class="badge">ADMIN</span>
    </div>
    <div class="controls">
      <button type="button" class="src" id="srcChip" title="資料來源">未載入</button>
      <label for="daySel" class="muted" style="font-size:13px">賽日</label>
      <select id="daySel" class="sel" aria-label="賽日"><option>載入中…</option></select>
      <button type="button" class="btn btn-icon" id="btnReload" aria-label="重新載入資料"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button type="button" class="btn btn-icon" id="btnTheme" aria-label="切換深色/淺色"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button type="button" class="btn btn-q" id="btnQimen" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span id="qimenLbl">奇門:顯示中</span></button>
      <button type="button" class="btn btn-primary" id="btnAdmin" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>輸入新數據</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="admin" class="panel admin hidden" aria-label="輸入新數據">
    <div style="flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:10px">
      <label for="jsonIn" style="font-weight:700">貼上賽事 JSON</label>
      <span class="muted" style="font-size:13px">特徵 JSON 會用內置引擎計分(同 hkjc_engine.py 一致);process_day.py 輸出嘅 dashboard JSON 會直接顯示。</span>
      <textarea id="jsonIn" rows="5" placeholder='{ "race_info": { "date": "2026-10-11", "race_no": 1, ... }, "horses": [ ... ] }'></textarea>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <button type="button" class="btn btn-primary" id="btnParse">解析數據</button>
        <button type="button" class="btn" id="btnSave" disabled>存入資料庫</button>
        <span id="parseMsg" class="muted" style="font-size:13px"></span>
      </div>
    </div>
    <div style="flex:1 1 300px;display:flex;flex-direction:column;gap:12px">
      <div class="boxr">
        <span style="font-weight:700">資料來源</span>
        <span class="muted" style="font-size:13px" id="srcText">未載入</span>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <button type="button" class="btn" id="btnGas">線上 Google Sheet</button>
          <button type="button" class="btn" id="btnFile">開啟資料庫檔案</button>
          <input type="file" id="fileIn" accept=".xlsx,.xls" class="hidden">
        </div>
        <span class="faint" style="font-size:12px">資料庫檔案(.xlsx)有齊賠率、奇門號碼同派彩;線上模式視乎 Apps Script 回傳咩欄位。</span>
      </div>

    dirt_frontrunner_bonus: 3.0, dirt_kickback_penalty: -2.0, dirt_inner_draw_max: 5,
    class_drop_mult: 1.0, perfect_trip_penalty: -1.5,   // class_drop_mult 由1.15改1.0: backtest證實有害,暫停降班加成
    shadow_uncertainty_discount: 0.95,
    ppi_fast: 6.0, ppi_slow: 3.0,
    small_field_threshold: 7, small_field_back_penalty: -1.5, small_field_lead_bonus: 1.0,
    core_top_n: 3, value_tir_trigger: 2.5,
    chronic_block_count: 2,
  };

  const POS_NOTATION = /[\(（][0-9０-９WwＷ\s]+[\)）]/g;
  // [score, regex, label] 由嚴重到輕
  const TIR_PATTERNS = [
    [3.0, /受阻|阻礙|被迫收慢|blocked|checked|held up/, "受阻"],
    [2.5, /未能望空|難以望空|no clear run/, "未能望空"],
    [2.0, /走大外疊|走最外疊|走外疊|走第四疊|走第三疊|wide/, "走外疊"],
    [1.5, /失蹄|起步.{0,4}慢|出閘.{0,4}慢|躍出.{0,4}慢|稍慢|slow (to begin|away)/, "起步緩慢"],
    [1.0, /擠迫|碰撞|觸碰|crowded|hamper/, "受擠迫"],
  ];
  const TIR_BLOCK_KW = /受阻|阻礙|被迫收慢|未能望空|難以望空/;
  const TIR_DIRECTIONAL = /直路.{0,12}(受阻|阻礙|未能望空|難以望空)/;
  const TIR_DIRT_WIDE = 0.5;

  // 同 Python round(x, 1) 一致(以 double 嘅精確值四捨六入、正中半數取雙)
  const round1 = (x) => {
    if (typeof x !== "number" || !isFinite(x)) return x;
    const neg = x < 0; const s = Math.abs(x).toFixed(100);
    const dot = s.indexOf("."); const ip = s.slice(0, dot); const fp = s.slice(dot + 1);
    const d1 = +fp[0]; const rest = fp.slice(1); const half = "5" + "0".repeat(rest.length - 1);
    const up = rest > half ? true : rest < half ? false : (d1 % 2 === 1);
    const v = (Number(ip) * 10 + d1 + (up ? 1 : 0)) / 10;
    return neg ? -v : v;
  };
  const num = (v) => (typeof v === "number" && !isNaN(v) ? v : null);

  function surfaceKey(surface, raceClass) {
    const s = (surface || "").toLowerCase();
    if (s.includes("dirt") || s.includes("all weather") || s.includes("awt") || s.includes("泥")) return "dirt";
    if (String(raceClass).includes("5")) return "class5";
    return "turf_1_4";
  }
  function baselineOf(arr) {
    const vals = (arr || []).filter((e) => e && e > 0).sort((a, b) => b - a);
    if (!vals.length) return null;
    const top = vals.slice(0, 3);
    return top.reduce((a, b) => a + b, 0) / top.length;
  }
  function formOf(arr) {
    const vals = (arr || []).filter((e) => e && e > 0);
    if (!vals.length) return null;
    if (vals.length === 1) return vals[0];
    return vals[0] * 0.6 + vals[1] * 0.4;
  }
  function healthAdj(h) {
    let adj = 0;
    if (num(h.body_weight) && num(h.last_win_weight) &&
        Math.abs(h.body_weight - h.last_win_weight) >= P.weight_delta_lbs) adj += P.weight_penalty;
    if (num(h.days_since_run) && h.days_since_run > P.long_layoff_days && !h.had_recent_trial) adj += P.layoff_penalty;
    return adj;
  }

  function computeTir(comments, isDirt) {
    if (!comments || !comments.length) return [0, ""];
    const cleaned = comments.map((c) => String(c).replace(POS_NOTATION, " "));
    const blockHits = cleaned.filter((c) => TIR_BLOCK_KW.test(c)).length;
    if (blockHits >= P.chronic_block_count) return [0, `習慣性受阻x${blockHits}(TIR收回)`];
    for (const c of cleaned) if (TIR_DIRECTIONAL.test(c)) return [4.0, "直路受阻"];
    for (const [score, pat, label] of TIR_PATTERNS) {
      if (cleaned.some((c) => pat.test(c))) {
        const s = (isDirt && label === "走外疊") ? TIR_DIRT_WIDE : score;
        return [s, label];
      }
    }
    return [0, ""];
  }

  function computePpi(styles, fieldSize) {
    const up = styles.map((s) => String(s).toUpperCase().trim());
    const nLead = up.filter((s) => s === "LEADER").length;
    const nPace = up.filter((s) => s === "ON-PACE" || s === "ON PACE" || s === "ONPACE").length;
    const raw = 1.5 * nLead + 1.0 * nPace;
    const fs = fieldSize || up.filter((s) => s).length || 1;
    const ppi = round1((10.0 * raw) / fs);   // 場次規模正規化 (典型約 3-5)
    let label = "Medium";
    if (ppi >= P.ppi_fast) label = "High";
    else if (ppi <= P.ppi_slow) label = "Slow";
    return [ppi, label];
  }

  function paceFit(style, ppi, fieldSize) {
    style = String(style).toUpperCase().trim();
    let fit = 0;
    if (ppi >= P.ppi_fast) fit = { BACK: 1.5, MIDFIELD: 0.5, "ON-PACE": -0.5, LEADER: -1.5 }[style] || 0;
    else if (ppi <= P.ppi_slow) fit = { LEADER: 1.5, "ON-PACE": 1.0, MIDFIELD: -0.5, BACK: -1.5 }[style] || 0;
    if (fieldSize && fieldSize <= P.small_field_threshold) {
      if (style === "BACK") fit += P.small_field_back_penalty;
      else if (style === "LEADER" || style === "ON-PACE") fit += P.small_field_lead_bonus;
    }
    return round1(fit);
  }

  function computeDmr(h, sKey, classAvg) {
    let baseline = baselineOf(h.energy_same_cond);
    let form = formOf(h.energy_recent);
    const notes = [];

    // 影子建模 (新馬)
    if (h.is_debutant || (baseline === null && form === null)) {
      if (classAvg === null) return [0, "Shadow", "無班次基準,無法影子建模"];
      let v = classAvg;
      if (num(h.sire_surface_roi) !== null) {
        v += Math.min(Math.max(h.sire_surface_roi * 5.0, -3), 5);
        notes.push(`PSS(${h.sire_surface_roi})`);
      }
      const t = (h.trial_text || "").toLowerCase();
      if (/輕鬆|未受催策|easy|comfortabl|unridden|held/.test(t)) { v += 3.0; notes.push("試閘輕鬆+3"); }
      else if (/受催策|hard ridden|pushed/.test(t)) { v -= 1.0; notes.push("試閘受催-1"); }
      v *= P.shadow_uncertainty_discount;
      return [round1(v), "Shadow", "影子建模 " + notes.join(" ")];
    }

    const p = P[sKey];
    if (baseline === null) {
      const pool = [...(h.energy_recent || []), ...(h.energy_same_cond || [])].filter((e) => e && e > 0);
      baseline = pool.length ? Math.max(...pool) : (form || 0);
    }
    if (form === null) form = baseline || 0;
    const health = healthAdj(h) * p.health_mult;
    let dmr = baseline * p.baseline + form * p.form + health;
    notes.push(`B(${Math.round(baseline)})*${p.baseline}+F(${Math.round(form)})*${p.form}`);
    if (health) notes.push(`H${health > 0 ? "+" : ""}${round1(health)}`);

    if (sKey === "dirt") {
      const style = String(h.running_style).toUpperCase().trim();
      if ((style === "LEADER" || style === "ON-PACE") && h.draw && h.draw <= P.dirt_inner_draw_max) {
        dmr += P.dirt_frontrunner_bonus; notes.push(`泥地前領+${P.dirt_frontrunner_bonus}`);
      } else if (style === "BACK" || style === "MIDFIELD") {
        if (!((h.sire_surface_roi || 0) > 0.1)) { dmr += P.dirt_kickback_penalty; notes.push(`踢土${P.dirt_kickback_penalty}`); }
      }
    }
    if (h.class_dropped) { dmr *= P.class_drop_mult; notes.push(`降班x${P.class_drop_mult}`); }
    if (h.last_race_easy_slow_lead) { dmr += P.perfect_trip_penalty; notes.push(`好位罰${P.perfect_trip_penalty}`); }
    return [round1(dmr), "Actual", notes.join(" ")];
  }

  function classifyDualTrack(rs) {
    const actual = rs.filter((r) => r.dmr_type === "Actual" && r.dmr > 0).sort((a, b) => b.dmr - a.dmr);
    const coreNums = new Set(actual.slice(0, P.core_top_n).map((r) => r.number));
    for (const r of rs) {
      if (r.dmr_type === "Shadow") { r.track = "VALUE"; r.note = ("[覆蓋·高方差] " + r.note).trim(); continue; }
      if (r.dmr <= 0) { r.track = "LOW"; continue; }
      const isCore = coreNums.has(r.number);
      const tirLifted = r.tir_bonus >= P.value_tir_trigger;
      if (isCore && r.tir_bonus >= 0) r.track = "CORE";
      else if (tirLifted || r.class_dropped) r.track = "VALUE";
      else r.track = "AVERAGE";
    }
    const nonshadow = rs.filter((r) => r.dmr_type === "Actual" && r.dmr > 0);
    if (nonshadow.length) {
      const sorted = nonshadow.map((r) => r.dmr).sort((a, b) => a - b);
      const lowCut = sorted[Math.max(1, Math.floor(nonshadow.length / 4)) - 1];   // 同 Python: max(1, n//4)
      for (const r of nonshadow) if (r.track === "AVERAGE" && r.dmr <= lowCut) r.track = "LOW";
    }
    return rs;
  }

  const TRACK_TO_RANK = { CORE: "Core", VALUE: "Value", AVERAGE: "Average", RISK: "Risk", LOW: "Low" };

  function bettingShape(rs, gap, hasSingleBanker) {
    const core = rs.filter((r) => r.track === "CORE").sort((a, b) => b.dmr - a.dmr);
    const value = rs.filter((r) => r.track === "VALUE");
    if (!core.length) return "混戰: 無穩定核心,只宜小注覆蓋 VALUE 軌或放棄。";
    const msg = [];
    if (hasSingleBanker) msg.push(`單膽格局: #${core[0].number} 拋離,作膽拖 2-4 名。`);
    else if (core.length >= 2 && gap < 2) msg.push(`雙龍出海: #${core[0].number} / #${core[1].number} 接近,Q/QP 互串。`);
    else msg.push("標準核心: 以 CORE 軌組位置Q。");
    if (value.length) msg.push(`長尾覆蓋: ${value.slice(0, 3).map((r) => "#" + r.number).join("/")} 作配腳拖入單T/四連環 (重 ROI,小注)。`);
    return msg.join(" ");
  }

  function run(race) {
    const info = race.race_info || race.race || {};
    const raceClass = info.class || "";
    const horses = race.horses || [];
    const fieldSize = info.field_size || horses.length;
    const sKey = surfaceKey(info.surface || info.course || "", raceClass);
    const isDirt = sKey === "dirt";

    const todayClsMatch = String(raceClass).match(/\d+/);
    const todayCls = todayClsMatch ? parseInt(todayClsMatch[0], 10) : null;
    for (const h of horses) {
      if (h.last_race_class != null && todayCls != null) h.class_dropped = todayCls > h.last_race_class;
    }

    const bases = horses.map((h) => baselineOf(h.energy_same_cond)).filter((b) => b);
    const classAvg = bases.length ? bases.sort((a, b) => a - b)[Math.floor(bases.length / 2)] : null;

    const [ppi, ppiLabel] = computePpi(horses.map((h) => h.running_style), fieldSize);

    const results = horses.map((h) => {
      const [dmr, dtype, note] = computeDmr(h, sKey, classAvg);
      const [tir, treason] = computeTir(h.comments_recent, isDirt);
      const final = dtype === "Actual" ? round1(dmr + tir) : dmr;
      return {
        number: h.number, name_ch: h.name_ch || "", name_en: h.name_en || "",
        dmr: final, dmr_type: dtype, tir_bonus: tir, tir_reason: treason,
        track: "", note, running_style: h.running_style || "MIDFIELD",
        draw: h.draw, class_dropped: !!h.class_dropped,
      };
    });

    classifyDualTrack(results);

    // 單膽偵測 + Banker 標記
    const core = results.filter((r) => r.track === "CORE").sort((a, b) => b.dmr - a.dmr);
    const gap = core.length > 1 ? core[0].dmr - core[1].dmr : 99;
    const hasSingleBanker = core.length > 0 && gap >= 4;
    const bankerNum = hasSingleBanker ? core[0].number : null;

    const shape = bettingShape(results, gap, hasSingleBanker);

    // 轉成 dashboard 舊格式
    const outHorses = results.sort((a, b) => a.number - b.number).map((r) => {
      const tirStr = "+" + r.tir_bonus.toFixed(1) + (r.tir_reason ? ` (${r.tir_reason})` : "");
      let rank = TRACK_TO_RANK[r.track] || "Average";
      if (r.number === bankerNum) rank = "Banker";
      return {
        number: r.number, name: r.name_en || r.name_ch, name_ch: r.name_ch,
        dmr_score: r.dmr, tir_bonus: tirStr, rank_prediction: rank,
        running_style: r.running_style, barrier_draw: r.draw == null ? "" : r.draw,
        dmr_type: r.dmr_type,
      };
    });

    return {
      race_info: {
        date: info.date || "", venue: info.venue || "", race_no: info.race_no || "",
        class: info.class || "-", course: info.course || "-", distance: info.distance || "",
        ppi_score: `${Number.isInteger(ppi) ? ppi.toFixed(1) : ppi} (${ppiLabel})`,   // 同 Python 一樣顯示 5.0
      },
      horses: outHorses,
      _betting_shape: shape,
    };
  }

  // 偵測是否為「特徵格式」(需計分) — 馬匹缺 dmr_score 即係特徵格式
  function isFeatureFormat(data) {
    return data && Array.isArray(data.horses) && data.horses.length > 0 &&
      (data.horses[0].dmr_score === undefined || data.horses[0].dmr_score === null);
  }

  return { run, isFeatureFormat };
})();

if (typeof module !== "undefined" && module.exports) module.exports = HKJC_ENGINE;

      const dv = {}; for (const p of POOLS) { const items = parseDividendCell(r[di(p)]); if (items.length) dv[p] = items; }
      race.dividends = Object.keys(dv).length ? dv : null;
    }

}

// ---------- 載入 ----------
function setSource(src, label) {
  S.source = src; S.srcLabel = label; $('srcChip').textContent = label; $('srcText').textContent = '而家用緊:' + label;
}
function buildList() {
  S.list = [...S.races.values()].map((r) => ({ date: r.date, no: r.no })).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : a.no - b.no));
}
function fillDays(preferDate) {
  const dates = [...new Set(S.list.map((x) => x.date))];
  const sel = $('daySel');
  sel.innerHTML = dates.map((d) => {
    const first = S.list.find((x) => x.date === d) || {};
    const any = S.races.get(key(d, first.no));
    const venue = (any && any.venue) || first.venue || '';
    const wd = WEEK[new Date(d + 'T12:00:00').getDay()];
    return `<option value="${esc(d)}">${esc(d)} (${wd})${venue ? ' ' + venueZh(venue) : ''}</option>`;
  }).join('') || '<option>無資料</option>';
  const d = preferDate && dates.includes(preferDate) ? preferDate : dates[0];
  if (d) { sel.value = d; selectDay(d); } else showEmpty('資料庫入面冇賽事。');

function showEmpty(msg) { $('emptyMsg').textContent = msg; $('emptyState').classList.remove('hidden'); $('raceView').classList.add('hidden'); $('tabs').innerHTML = ''; }

async function loadGas() {
  setSource('gas', '線上 · 載入中…');
  try {
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'get_race_list' }) });
    const data = await res.json();
    const list = (data.list || []).map((x) => ({ date: normDate(x.date), no: toNum(x.race_no), venue: x.venue || '' })).filter((x) => x.date && x.no != null);
    if (!list.length) throw new Error('empty');
    S.races = new Map(); S.list = list.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : a.no - b.no));
    setSource('gas', '線上 Google Sheet'); LS.set('rl.source', 'gas');
    $('emptyState').classList.add('hidden'); fillDays(S.date);
  } catch (e) {
    console.warn('GAS load failed', e);
    setSource(null, '未載入');
    if (loadCache(true)) { toast('連唔到線上資料庫,改用上次開過嘅資料庫檔案。'); return; }
    showEmpty('連唔到線上資料庫。可以重試,或者開啟本機資料庫檔案(.xlsx)。');

}
async function getRace(date, no) {
  const k = key(date, no);
  if (S.races.has(k)) return S.races.get(k);
  if (S.source !== 'gas') return null;
  const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'get_race_detail', date, race_no: no }) });
  const resp = await res.json();
  if (resp.result !== 'success' || !resp.data) throw new Error('detail failed');
  const race = fromDashboardJson(resp.data); race.date = race.date || date; race.no = race.no ?? no;
  S.races.set(k, race); return race;
}
function ensureXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = XLSX_CDN; s.onload = () => ok(); s.onerror = () => fail(new Error('載入 SheetJS 失敗(要上網)')); document.head.appendChild(s); });
}
async function openFile(file) {
  try {
    toast('讀取緊 ' + file.name + ' …', 8000);
    await ensureXLSX();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const races = fromWorkbook(wb);
    if (!races.size) throw new Error('檔案入面冇賽事資料');
    S.races = races; buildList();
    const label = '資料庫檔案 · ' + file.name.replace(/\.xlsx?$/i, '');
    setSource('file', label); LS.set('rl.source', 'file');

    $('emptyState').classList.add('hidden');
    fillDays(S.date);
    toast(`已載入 ${races.size} 場(${new Set(S.list.map((x) => x.date)).size} 個賽日)` + (ok ? '' : ';瀏覽器冇位記住,下次要再開檔'));
  } catch (e) { console.error(e); toast('開唔到檔案:' + e.message, 6000); }
}
function loadCache(silent) {
  const raw = LS.get('rl.db'); if (!raw) return false;
  try {
    const c = JSON.parse(raw); if (!c || !Array.isArray(c.races)) return false;
    S.races = new Map(c.races.map((r) => [key(r.date, r.no), r])); buildList();

// ---------- 選擇 ----------
function selectDay(date) {
  S.date = date;
  const races = S.list.filter((x) => x.date === date).sort((a, b) => a.no - b.no);
  const pick = races.find((x) => x.no === S.no) || races[0];
  renderTabs(races);
  if (pick) selectRace(date, pick.no);
}
async function selectRace(date, no) {
  S.date = date; S.no = no;
  const token = ++S.loadingToken;
  [...$('tabs').children].forEach((b) => b.setAttribute('aria-current', +b.dataset.no === no ? 'page' : 'false'));
  try {
    const race = await getRace(date, no);
    if (token !== S.loadingToken) return;
    if (!race) { toast('搵唔到呢場資料'); return; }
    S.race = race; S.lit = new Set(race.qimen || []); S.scene = null;
    $('raceView').classList.remove('hidden'); $('emptyState').classList.add('hidden');
    renderRace(); renderTabs(S.list.filter((x) => x.date === date).sort((a, b) => a.no - b.no));
  } catch (e) { console.error(e); if (token === S.loadingToken) toast('載入唔到呢場(線上連線問題)'); }
}

// ---------- 計算 ----------
function analyse(race) {
  const hs = race.horses.slice().sort((a, b) => b.dmr - a.dmr || a.no - b.no);
  hs.forEach((h, i) => { h.pos = i + 1; });
  const cores = hs.filter((h) => h.rank === 'Core' || h.rank === 'Banker');
  const banker = hs.find((h) => h.rank === 'Banker') || null;
  const coreGap = cores.length > 1 ? cores[0].dmr - cores[1].dmr : null;
  const values = hs.filter((h) => h.rank === 'Value');
  const placed = race.horses.filter((h) => h.place != null && h.place > 0);
  const hasResults = placed.filter((h) => h.place <= 3).length >= 1;
  const winner = placed.find((h) => h.place === 1) || null;
  const top6In3 = hs.slice(0, 6).filter((h) => h.place != null && h.place <= 3).length;
  return { hs, cores, banker, coreGap, values, hasResults, winner, top6In3, field: race.horses.length, debut: race.horses.filter((h) => /shadow/i.test(h.type)).length };
}
function shapeText(race, A) {
  if (race.shape) return race.shape;
  const core = A.cores; const parts = [];
  if (!core.length) return '<strong style="color:var(--value-text)">混戰</strong>:冇穩定核心,只宜小注覆蓋 VALUE 或者放棄。';
  if (A.banker) parts.push(`<strong style="color:var(--good)">單膽格局</strong>:#${A.banker.no} ${esc(A.banker.ch)} 拋離,作膽拖 2–4 名。`);
  else if (core.length >= 2 && A.coreGap != null && A.coreGap < 2) parts.push(`<strong style="color:var(--good)">雙龍出海</strong>:#${core[0].no} / #${core[1].no} 接近,Q / 位置Q 互串。`);
  else parts.push('<strong style="color:var(--good)">標準核心</strong>:以 CORE 軌組位置Q。');
  if (A.values.length) parts.push(`<strong style="color:var(--value-text)">長尾覆蓋</strong>:${A.values.slice(0, 3).map((h) => '#' + h.no).join(' / ')} 作配腳拖入單T / 四連環(重 ROI,小注)。`);
  return parts.join(' ');
}
function litMap() {
  const m = {}; if (!S.showQimen) return m;
  const field = S.race ? S.race.horses.length : 14;
  for (const p of PALACES) if (S.lit.has(p.name)) for (const n of p.nums) if (n <= Math.max(field, 14)) { (m[n] = m[n] || []); if (!m[n].includes(p.name)) m[n].push(p.name); }
  return m;
}
function isNightRace(race) {
  if (race.postTime) { const h = parseInt(String(race.postTime), 10); if (isFinite(h)) return h >= 18; }
  if (isHV(race.venue)) return true;
  const wd = new Date(race.date + 'T12:00:00').getDay();
  return wd === 3; // 沙田星期三夜馬
}

function stTrackSvg(race) {
  if (!/sha\s*tin|沙田|^st$/i.test(String(race.venue || ''))) return '';
  const awt = /awt|all\s*weather|dirt|泥|全天候/i.test(String(race.course || ''));
  const c = awt ? ST_TRACKS.awt : ST_TRACKS.turf; const dist = race.dist;
  let marks = '';
  for (const [d, m] of Object.entries(c.starts)) {
    const cur = +d === dist; const col = cur ? 'var(--start)' : 'var(--text)';
    if (cur && m.seg) marks += `<path d="${m.seg}" stroke="var(--start)" stroke-width="${m.sw.toFixed(1)}" stroke-linecap="round"/>`;
    marks += `<path d="${m.tick}" stroke="${col}" stroke-width="${cur ? 7 : 4.5}" stroke-linecap="round" fill="none"/>`;
    marks += `<path d="${m.arrow}" stroke="${col}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
    let lx = m.lab[0], ly = m.lab[1], anc = 'middle';
    if (cur) { // 本場起步:標籤移出一行,避開其他起步點;近邊位就靠邊對齊
      ly = m.side === 'top' ? ly - 36 : ly + 38;
      const [vx, , vw] = c.vb.split(' ').map(Number);
      if (lx - 110 < vx) { anc = 'start'; lx -= 16; } else if (lx + 110 > vx + vw) { anc = 'end'; lx += 16; }
    }
    marks += `<text x="${lx}" y="${ly}" text-anchor="${anc}" font-size="${cur ? 36 : 31}" font-weight="${cur ? 700 : 600}" fill="${cur ? 'var(--start)' : 'var(--muted)'}" font-family="'Barlow Condensed','Noto Sans TC',sans-serif">${d}M${cur ? ' 起步' : ''}</text>`;
  }
  const W = c.W, p = W.pole;
  return `<figure class="trackfig"><svg viewBox="${c.vb}" style="width:100%;height:auto" role="img" aria-label="沙田${awt ? '全天候' : '草地'}跑道示意圖(按馬會起步點圖描繪),本場 ${dist || ''} 米起步點以橙色標示">

  <text x="${c.infXY[0]}" y="${c.infXY[1]}" text-anchor="middle" font-size="40" font-weight="700" fill="var(--faint)">${c.infText}</text>
  ${marks}

  <circle cx="${W.cx}" cy="${W.cy}" r="${W.r}" fill="#FFFFFF" stroke="#15201B" stroke-width="7"/>
  <text x="${W.cx}" y="${W.cy + 14}" text-anchor="middle" font-size="42" font-weight="700" fill="#D23B2E" font-family="'Barlow Condensed',sans-serif">W</text>
</svg></figure>`;
}
function trackSvg(race) {

  const dist = race.dist;
  const S_ = { 1000: { tick: 'M478 95 V240', arrow: 'M486 175 H568 M550 160 L570 175 L550 190', lab: [468, 70, 'end', 0] },
    2400: { tick: 'M540 95 V240', arrow: 'M548 175 H630 M612 160 L632 175 L612 190', lab: [552, 70, 'start', 0] },

function renderRank(race, A, lm) {
  const ds = A.hs.map((h) => h.dmr).filter((x) => x > 0);
  const hi = ds.length ? Math.max(...ds) : 100; const lo = Math.min(60, (ds.length ? Math.min(...ds) : 60) - 2);
  let rows = '';
  A.hs.forEach((h, i) => {
    if (i > 0) { const g = A.hs[i - 1].dmr - h.dmr; if (g >= 1.5) rows += `<div class="gaprow"><i></i><span class="num" style="font-size:13px;font-weight:600;color:var(--gap-text)">−${g.toFixed(1)}</span></div>`; }
    const lit = lm[h.no]; const top = h.place != null && h.place >= 1 && h.place <= 3;
    const bar = Math.max(4, Math.min(100, Math.round((h.dmr - lo) / Math.max(1, hi - lo) * 100)));
    rows += `<div class="rgrid rrow rk-${h.rank}${h.rank === 'Low' ? ' dim' : ''}">
      <span class="num muted" style="font-size:17px;font-weight:600">${h.pos}</span>
      <span class="disc${lit ? ' on' : ''}">${h.no}</span>
      <span style="display:flex;flex-direction:column;min-width:0"><span style="font-weight:700;display:flex;align-items:center;gap:6px">${esc(h.ch || h.en)}${lit ? `<span class="ptag">${lit.join(' ')}</span>` : ''}</span><span class="muted" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(h.en)}</span></span>
      <span class="tag">${RANK_TAG[h.rank] || h.rank}</span>
      <span style="display:flex;align-items:center;gap:10px"><span class="bar"><i style="width:${bar}%"></i></span><span class="num" style="font-size:19px;font-weight:700;width:46px;text-align:right">${h.dmr.toFixed(1)}</span></span>
      <span style="display:flex;flex-direction:column;line-height:1.25"><span class="num" style="font-size:16px;font-weight:600;color:${h.tir ? 'var(--tir)' : 'var(--faint)'}">${h.tir || h.tirWhy ? (h.tir >= 0 ? '+' : '') + h.tir.toFixed(1) : '—'}</span><span class="muted" style="font-size:12px">${esc(h.tirWhy)}</span></span>
      <span style="font-size:14px">${STYLE_ZH[h.style] || '—'}</span>
      <span class="num" style="font-size:17px;font-weight:600">${h.draw ?? '—'}</span>
      <span class="num" style="font-size:17px;font-weight:600;text-align:right">${fmtNum(h.odds)}</span>
      <span class="place${top ? ' top' : ''}">${h.place != null && h.place > 0 ? h.place : '—'}</span>
    </div>`;
  });
  const legend = ['Core', 'Value', 'Average', 'Low'].map((k) => `<span class="rk-${k}"><i></i>${RANK_TAG[k]}</span>`).join('');
  $('secRank').innerHTML = `<div class="sec-head" style="padding:0 24px 12px"><h2>評分排名</h2><div class="legend">${legend}<span>虛線 = 相鄰 DMR 差 ≥ 1.5</span></div></div>
  <div class="rank-wrap"><div class="rank-in"><div class="rgrid rhead"><span>排名</span><span>馬號</span><span>馬名</span><span>評級</span><span>DMR</span><span>TIR</span><span>跑法</span><span>檔</span><span style="text-align:right">賠率</span><span style="text-align:right">名次</span></div>${rows}</div></div>`;
}

function renderQimen(race, A, lm) {
  const sec = $('secQimen');
  sec.classList.toggle('hidden', !S.showQimen);
  if (!S.showQimen) return;
  const night = S.scene ? S.scene === 'night' : isNightRace(race);
  $('imgDay').style.opacity = night ? 0 : 1; $('imgNight').style.opacity = night ? 1 : 0;
  sec.querySelectorAll('[data-scene]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.scene === 'night') === night)));
  $('qpaint').classList.toggle('night', night);
  const W = 1280 / 3, H = 653 / 3, third = 100 / 3;
  const on = (p) => S.lit.has(p.name);
  const holes = PALACES.filter((p) => p.nums.length).map((p) => `<rect x="${(p.col * W + 18).toFixed(1)}" y="${(p.row * H + 12).toFixed(1)}" width="${(W - 36).toFixed(1)}" height="${(H - 24).toFixed(1)}" rx="24" opacity="${on(p) ? 1 : 0}"/>`).join('');
  const glows = PALACES.filter((p) => p.nums.length).map((p) => `<ellipse cx="${(p.col * W + W / 2).toFixed(1)}" cy="${(p.row * H + H / 2).toFixed(1)}" rx="200" ry="108" fill="url(#qmLamp)" style="opacity:${on(p) ? 1 : 0};transition:opacity .5s"/>`).join('');
  const veil = S.lit.size ? (night ? 0.62 : 0.5) : 0;
  const field = race.horses.length;
  const svg = `<svg class="qsvg" viewBox="0 0 1280 653" preserveAspectRatio="none" aria-hidden="true"><defs>
    <radialGradient id="qmLamp"><stop offset="0" stop-color="#FFD27A" stop-opacity="0.55"/><stop offset="0.5" stop-color="#FFC060" stop-opacity="0.22"/><stop offset="1" stop-color="#FFC060" stop-opacity="0"/></radialGradient>
    <filter id="qmBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <mask id="qmMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="653"><rect x="0" y="0" width="1280" height="653" fill="#fff"/><g filter="url(#qmBlur)" fill="#000">${holes}</g></mask></defs>
    <rect x="0" y="0" width="1280" height="653" fill="${night ? '#01040D' : '#1B1206'}" mask="url(#qmMask)" style="opacity:${veil};transition:opacity .5s"/>
    <g style="mix-blend-mode:screen">${glows}</g></svg>`;
  const hits = PALACES.filter((p) => p.nums.length).map((p) => `<button type="button" class="qhit" data-palace="${p.name}" aria-pressed="${on(p)}" aria-label="${p.name}(${p.scene}):${p.nums.join('、')}${on(p) ? ',已著燈' : ''}" style="left:${(p.col * third).toFixed(3)}%;top:${(p.row * third).toFixed(3)}%"></button>`).join('');
  const labels = PALACES.map((p) => {
    const l = (p.col * third + 1.2).toFixed(3) + '%', t = (p.row * third + 2.6).toFixed(3) + '%', b = ((2 - p.row) * third + 3).toFixed(3) + '%';
    const seal = `<span class="qseal${p.nums.length ? (on(p) ? ' on' : '') : ' mid'}"><span>${p.name[0]}</span><span>${p.name[1]}</span></span>`;
    const isFlag = (race.qimen || []).includes(p.name);
    const cap = `<span class="qcap${on(p) ? ' on' : ''}">${p.scene}${isFlag ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B23A2C" stroke-width="2.4" stroke-linecap="round" role="img" aria-label="師傅 app 標示嘅宮位"><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 2M5 4l3 2M19 4l-3 2"/></svg>' : ''}</span>`;
    const nums = p.nums.length ? `<span class="qnums" style="left:${l};bottom:${b}">${p.nums.map((n) => `<span class="qn${n > field ? ' off' : on(p) ? ' on' : ''}">${n}</span>`).join('')}</span>` : '';
    return `<span class="qlab" style="left:${l};top:${t}">${seal}${cap}</span>${nums}`;
  }).join('');
  $('qOverlay').innerHTML = svg + hits + labels;
  const litNos = Object.keys(lm).map(Number).filter((n) => race.horses.some((h) => h.no === n)).sort((a, b) => a - b);
  $('litList').innerHTML = litNos.map((n) => { const h = A.hs.find((x) => x.no === n);
    return `<div class="pill-row rk-${h.rank}"><span class="disc on">${n}</span><span style="flex:1;font-weight:500">${esc(h.ch || h.en)}</span><span class="muted" style="font-size:12px">${RANK_TAG[h.rank]} · DMR 第 ${h.pos}</span><span class="num" style="font-size:16px;font-weight:700;min-width:40px;text-align:right">${h.place != null && h.place > 0 ? '第 ' + h.place : '—'}</span></div>`; }).join('');
}

function renderResults(race, A, lm) {
  const placed = race.horses.filter((h) => h.place != null && h.place >= 1 && h.place <= 4).sort((a, b) => a.place - b.place);
  const ord = ['1st', '2nd', '3rd', '4th'];
  const tiles = placed.map((h) => { const a = A.hs.find((x) => x.no === h.no);
    return `<div class="res-t rk-${h.rank}"><div style="display:flex;align-items:center;justify-content:space-between"><span class="num" style="font-size:22px;font-weight:700;line-height:1">${ord[h.place - 1] || h.place}</span><span class="num" style="font-size:20px;font-weight:700;line-height:1">${fmtNum(h.odds)}${h.odds != null ? '<span class="muted" style="font-size:12px;font-weight:500"> 倍</span>' : ''}</span></div>
    <div style="display:flex;align-items:center;gap:8px">${beadHtml(h, lm).replace('class="bead', 'style="width:28px;height:28px" class="bead')}<span style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(h.ch || h.en)}</span></div>
    <span class="muted" style="font-size:12px">${RANK_TAG[h.rank]} · DMR 第 ${a ? a.pos : '—'}</span></div>`; }).join('');
  $('secResults').innerHTML = `<div class="sec-head"><h2>賽果</h2><span class="muted" style="font-size:12px">賠率 = 最後獨贏</span></div>${tiles ? `<div class="res">${tiles}</div>` : '<span class="empty">未有賽果(跑完後自動抓取)</span>'}`;
}
function renderDividends(race) {
  const dv = race.dividends;
  let body = '<span class="empty">未有派彩</span>';
  if (dv) body = POOLS.filter((p) => dv[p] && dv[p].length).map((p) => `<div class="divrow"><span class="muted" style="font-size:14px;padding-top:3px">${p}</span><div style="display:flex;flex-direction:column;gap:6px">${dv[p].map((it) => `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="combo">${it.combo.map((c) => `<span>${esc(c)}</span>`).join('')}</span><span class="num" style="font-size:17px;font-weight:700">${fmtMoney(it.amt)}</span></div>`).join('')}</div></div>`).join('');
  $('secDiv').innerHTML = `<div class="sec-head" style="padding-bottom:6px"><h2>派彩</h2><span class="muted" style="font-size:12px">每 $10 注</span></div>${body}`;
}

function renderRace() {
  const race = S.race; if (!race) return;
  const A = analyse(race); const lm = litMap();
  renderCard(race, A); renderLanes(race, A, lm); renderBoard(race, A, lm); renderRank(race, A, lm); renderQimen(race, A, lm); renderResults(race, A, lm); renderDividends(race);
}
function renderLit() { // 奇門著燈改變時,只重畫受影響部分
  const race = S.race; if (!race) return;
  const A = analyse(race); const lm = litMap();
  renderLanes(race, A, lm); renderBoard(race, A, lm); renderRank(race, A, lm); renderQimen(race, A, lm); renderResults(race, A, lm);
}

// ---------- 輸入新數據 ----------
function parseInput() {
  const txt = $('jsonIn').value.trim(); if (!txt) { $('parseMsg').textContent = '未貼 JSON'; return; }
  try {
    const clean = (o) => typeof o === 'string' ? o.replace(/\s*\[cite:[^\]]*\]/g, '').trim() : Array.isArray(o) ? o.map(clean) : (o && typeof o === 'object') ? Object.fromEntries(Object.entries(o).map(([k, v]) => [k, clean(v)])) : o;
    let data = clean(JSON.parse(txt));   // 同 process_day.py 一樣剷走 [cite: …]
    let engine = false;
    if (typeof HKJC_ENGINE !== 'undefined' && HKJC_ENGINE.isFeatureFormat(data)) { data = HKJC_ENGINE.run(data); engine = true; }
    if (!data.race_info || !Array.isArray(data.horses)) throw new Error('要有 race_info 同 horses');
    if (data.horses.length && data.horses[0].dmr_score == null) throw new Error('計唔到分(引擎未載入)');
    const race = fromDashboardJson(data);
    if (!race.date || race.no == null) throw new Error('race_info 要有 date 同 race_no');
    const k = key(race.date, race.no);
    const old = S.races.get(k);
    if (old) { // 保留資料庫已有嘅賽果/賠率/奇門/派彩
      const byNo = Object.fromEntries(old.horses.map((h) => [h.no, h]));
      race.horses.forEach((h) => { const o = byNo[h.no]; if (o) { if (h.place == null) h.place = o.place; if (h.odds == null) h.odds = o.odds; } });
      if (!race.qimen.length) race.qimen = old.qimen; race.dividends = race.dividends || old.dividends; race.going = race.going || old.going;
    }
    S.races.set(k, race);
    if (!S.list.some((x) => x.date === race.date && x.no === race.no)) { S.list.push({ date: race.date, no: race.no }); S.list.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : a.no - b.no)); }
    S.pasted = Object.assign(data, { __key: k });
    $('btnSave').disabled = false;
    $('parseMsg').textContent = (engine ? '已用內置引擎計分 · ' : '已讀取 dashboard JSON · ') + `${race.date} R${race.no}(未存入資料庫)`;
    fillDays(race.date); S.no = race.no; selectRace(race.date, race.no);
  } catch (e) { console.error(e); $('parseMsg').textContent = 'JSON 有問題:' + e.message; }
}
function saveToSheet() {
  if (!S.pasted) return;
  const data = Object.assign({}, S.pasted); delete data.__key;
  $('btnSave').disabled = true;
  fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'save', data }) })
    .then(() => { toast('已送出去 Google Sheet。Apps Script 唔會回覆結果,請去 Sheet 核對一次。', 6000); $('parseMsg').textContent = '已送出 ' + data.race_info.date + ' R' + data.race_info.race_no; S.pasted = null; $('jsonIn').value = ''; renderRace(); })
    .catch((e) => { console.error(e); toast('送出失敗:' + e.message); $('btnSave').disabled = false; });
}

// ---------- 事件 ----------
function applyTheme() { document.documentElement.setAttribute('data-theme', S.theme); }
function bind() {
  $('btnTheme').addEventListener('click', () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; LS.set('rl.theme', S.theme); applyTheme(); });
  $('btnQimen').addEventListener('click', () => {
    S.showQimen = !S.showQimen; LS.set('rl.qimen', S.showQimen ? '1' : '0');
    $('btnQimen').setAttribute('aria-pressed', String(S.showQimen)); $('qimenLbl').textContent = S.showQimen ? '奇門:顯示中' : '奇門';
    renderLit();
  });
  $('btnAdmin').addEventListener('click', () => { const h = $('admin').classList.toggle('hidden'); $('btnAdmin').setAttribute('aria-expanded', String(!h)); });
  $('srcChip').addEventListener('click', () => { $('admin').classList.remove('hidden'); $('btnAdmin').setAttribute('aria-expanded', 'true'); });
  $('btnReload').addEventListener('click', () => { if (S.source === 'gas' || !S.source) loadGas(); else $('fileIn').click(); });
  $('btnGas').addEventListener('click', () => loadGas());
  $('btnFile').addEventListener('click', () => $('fileIn').click());
  $('fileIn').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) openFile(f); e.target.value = ''; });
  $('btnParse').addEventListener('click', parseInput);
  $('btnSave').addEventListener('click', saveToSheet);
  $('daySel').addEventListener('change', (e) => selectDay(e.target.value));
  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) selectRace(S.date, +b.dataset.no); });
  $('emptyState').addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (!b) return; if (b.dataset.act === 'gas') loadGas(); else $('fileIn').click(); });
  $('secQimen').addEventListener('click', (e) => {
    const sc = e.target.closest('[data-scene]'); if (sc) { S.scene = sc.dataset.scene; renderLit(); return; }
    const hit = e.target.closest('[data-palace]'); if (hit) { const p = hit.dataset.palace; S.lit.has(p) ? S.lit.delete(p) : S.lit.add(p); renderLit(); }
  });
}

applyTheme(); bind();
$('btnQimen').setAttribute('aria-pressed', String(S.showQimen)); $('qimenLbl').textContent = S.showQimen ? '奇門:顯示中' : '奇門';
if (LS.get('rl.source') === 'file' && loadCache(true)) { /* 用上次開過嘅檔案 */ } else loadGas();
window.__RL = { S, fromWorkbook, fromDashboardJson, openFile, analyse };
})();
</script>
